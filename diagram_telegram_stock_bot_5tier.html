  <title>Kiến Trúc Toàn Trình Telegram Stock Bot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0a0e17;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      overflow: hidden;
    }
    .diagram-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      box-sizing: border-box;
      background: radial-gradient(circle at 50% 40%, #111a2e 0%, #0a0e17 100%);
    }
    svg {
      width: 100%;
      height: 100%;
      max-width: 1280px;
      max-height: 720px;
      filter: drop-shadow(0 20px 50px rgba(0, 0, 0, 0.8));
    }
    .glow-line {
      stroke-dasharray: 8 4;
      animation: dash 30s linear infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }
    #scale-indicator {
      position: fixed;
      bottom: 14px;
      right: 16px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #38bdf8;
      font-family: monospace;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 9999px;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>

  <div id="scale-indicator">Auto-Scaling Vector Canvas</div>
  <script>
    function updateScale() {
      const svg = document.querySelector('svg');
      if (!svg) return;
      const rect = svg.getBoundingClientRect();
      const scale = Math.round((rect.width / 1280) * 100);
      const ind = document.getElementById('scale-indicator');
      if (ind) ind.textContent = `Scale: ${scale}% (${Math.round(rect.width)}x${Math.round(rect.height)})`;
    }
    window.addEventListener('resize', updateScale);
    window.addEventListener('DOMContentLoaded', updateScale);
    updateScale();
  </script>
